modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Hides Create's train map overlay (tracks, trains, stations and its toggle button) on Xaero's World Map,
and stops the server from sending train positions. Must be installed on both server and clients.
'''
# Shown as incompatible in the server list if the client does not have the same version.
# The actual connection refusal comes from the non-optional network payload registered by the mod.
displayTest="MATCH_VERSION"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    reason="This mod patches Create's train map classes."
    versionRange="[6.0.0,7.0.0)"
    ordering="AFTER"
    side="BOTH"
